<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产业周期复盘 · 英伟达 → 存储</title>
<style>
  :root{
    color-scheme: light dark;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --accent:#2a78d6; --border:rgba(11,11,11,.12); --card:rgba(11,11,11,.03);
    --sig-fin:#c98500; --sig-mkt:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
      --accent:#3987e5; --border:rgba(255,255,255,.14); --card:rgba(255,255,255,.04);
      --sig-fin:#fab219; --sig-mkt:#e66767; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .wrap{max-width:820px;width:100%}
  .head{text-align:center;margin-bottom:34px}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:.5px}
  .sub{color:var(--ink2);font-size:14.5px;line-height:1.65;margin:0 auto;max-width:600px}
  .sub b{color:var(--accent)}

  .cards{display:flex;flex-direction:column;gap:14px}
  a.card{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);
    border-radius:12px;padding:20px 22px;transition:.16s;position:relative}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent);
    box-shadow:0 6px 22px rgba(42,120,214,.16)}
  a.card.fin{border-left-color:var(--sig-fin)}
  a.card.mkt{border-left-color:var(--sig-mkt)}
  .ico{flex:0 0 auto;width:52px;height:52px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:24px;font-weight:700;
    background:rgba(42,120,214,.12);color:var(--accent)}
  a.card.mkt .ico{background:rgba(208,59,59,.13);color:var(--sig-mkt)}
  a.card.fin .ico{background:rgba(201,133,0,.14);color:var(--sig-fin)}
  .txt{flex:1;min-width:0}
  .txt .t{font-size:17px;font-weight:700;margin-bottom:3px}
  .txt .d{font-size:13px;color:var(--ink2);line-height:1.5}
  .arrow{flex:0 0 auto;font-size:20px;color:var(--muted);transition:.16s}
  a.card:hover .arrow{color:var(--accent);transform:translateX(3px)}

  .foot{text-align:center;margin-top:30px;font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>产业周期 S 曲线复盘</h1>
      <p class="sub">同一条 S 曲线,不同标的在重复走。<b>英伟达</b>已走完第一轮(参照系);<b>存储</b>慢半拍,正在重演同一剧本。</p>
    </div>

    <div class="cards">
      <a class="card mkt" href="storage.html">
        <div class="ico">★</div>
        <div class="txt">
          <div class="t">存储 · 真实事件复盘</div>
          <div class="d">双 S 曲线对照,每个节点挂真实新闻事件 + 日期 + 出处(高盛下调 2025/7、创纪录利润 2026/1、KOSPI 黑色星期一 2026/7)</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <a class="card" href="timeline.html">
        <div class="ico">①</div>
        <div class="txt">
          <div class="t">时间线复盘(具体)</div>
          <div class="d">英伟达第一轮 8 个节点,逐点标注「叙事 / 群众心理 / 实际验证」+ 存储对应位置</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <a class="card fin" href="framework.html">
        <div class="ico">②</div>
        <div class="txt">
          <div class="t">分析框架(抽象)</div>
          <div class="d">S 曲线三段式 + 两类见顶信号(◆财务见顶 / ●市场见顶)的通用框架图</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>

    <p class="foot">内容来自视频口述复盘 · 节点事件均可查证 · 截至 2026-07</p>
  </div>
</body>
</html>
